name: Packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['release/v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: python scripts/package-source.py
      - run: python scripts/collect-licenses.py
      - run: python scripts/package-windows.py
      - run: Copy-Item target/release/rpad.exe dist/RPad-0.1.2-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RPad-windows-x86_64
          path: |
            dist/RPad-0.1.2-windows-x86_64.zip
            dist/RPad-0.1.2-windows-x86_64.exe
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libfreetype-dev libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev patchelf
      - run: cargo build --release --locked
      - run: python3 scripts/package-source.py && python3 scripts/collect-licenses.py
      - name: AppImage
        run: |
          ./scripts/build-appdir.sh
          cp -r dist/licenses target/RPad.AppDir/usr/share/doc/rpad/
          cp dist/*sources.tar.gz dist/RPad-0.1.2-source.tar.gz target/RPad.AppDir/usr/share/doc/rpad/
          ./scripts/build-appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 dist/RPad-0.1.2-x86_64.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: RPad-AppImage-x86_64
          path: |
            dist/RPad-0.1.2-x86_64.AppImage
            dist/RPad-0.1.2-source.tar.gz
            dist/third-party-sources.tar.gz
  release:
    needs: [windows, appimage]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref_type == 'branch' && startsWith(github.ref_name, 'release/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag="${RELEASE_REF#release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd artifacts
          sha256sum *.AppImage *.exe *.zip *.tar.gz > SHA256SUMS
          printf '%s\n' \
            'A small, calm text editor, made for personal use.' \
            '' \
            'Linux: download the AppImage and mark it executable.' \
            'Windows: download the EXE, or use the ZIP for the installer, notices and source.' \
            '' \
            'Adds Pawn, SourcePawn, GDScript, Java, C# and CMake highlighting, improves Lua colors and selected tab markers, and caches editor rendering and search work.' \
            'Preserves normal window dimensions when closing fullscreen or maximized, and fixes the Wayland application icon identity.' \
            'Built with optimization level 3, fat LTO and one codegen unit.' \
            > release-notes.md
          gh release create "$tag" --target "$RELEASE_COMMIT" --title "RPad ${tag#v}" \
            --notes-file release-notes.md --draft \
            *.AppImage *.exe *.zip *.tar.gz SHA256SUMS
          gh release edit "$tag" --draft=false
